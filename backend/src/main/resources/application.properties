spring.application.name=shopcloud

# PostgreSQL (las credenciales se leen de variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shopcloud_test}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Zona horaria de negocio (vigencia de suscripciones y descuentos)
app.zona-horaria=America/Lima

# Servidor
# Orígenes permitidos separados por coma. Admite patrones, p. ej. https://*.vercel.app
app.cors.allowed-origin=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
# Render asigna el puerto en la variable PORT
server.port=${PORT:8080}
spring.config.import=optional:file:.env[.properties]